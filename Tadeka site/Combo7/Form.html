<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Form.css">
    <title>Document</title>
</head>
<body>
    <div class='container'>
        <div class="title">Cadastro</div>
        <form action="#">
            <div class="user-details">
                <div class="input-box">
                    <span class="details">Nome</span>
                    <input type="text" placeholder="Entrar o seu nome">
                </div>
            </div>
            <div class="user-details">
                <div class="input-box">
                    <span class="details">Sobrenome</span>
                    <input type="text" placeholder="Entrar o seu sobrenome">
                </div>
            </div>
            <div class="user-details">
                <div class="input-box">
                    <span class="details">Email</span>
                    <input type="email" placeholder="Entrar o seu email">
                </div>
            </div>
            <div class="user-details">
                <div class="input-box">
                    <span class="details">Número de celular</span>
                    <input type="text" placeholder="Entrar o seu número de celular">
                </div>
            </div>
            <div class="user-details">
                <div class="input-box">
                    <span class="details">Senha</span>
                    <input type="password" placeholder="Entrar a sua senha">
                </div>
            </div>
            <div class="user-details">
                <div class="input-box">
                    <span class="details">Senha Confimar</span>
                    <input type="password" placeholder="Entrar a sua senha confimar">
                </div>
            </div>
            <div class="gender-details">
                <input type="radio" name="gender" id="dot-1">
                <input type="radio" name="gender" id="dot-2">
                <input type="radio" name="gender" id="dot-3">
                <span class="gender-title">Nível em LIBRAS:</span>
                <div class="category">
                    <label for="dot-1">
                        <span class="dot one"></span>
                        <span class="gender">Básico</span>
                    </label>
                    <label for="dot-2">
                        <span class="dot two"></span>
                        <span class="gender">Médio</span>
                    </label>
                    <label for="dot-3">
                        <span class="dot three"></span>
                        <span class="gender">Fluente</span>
                    </label>
                </div>
            </div>
            <div class="button">
                <input type="submit" value="Registo">
            </div>
        </form>
    </div>
</body>
</html>
