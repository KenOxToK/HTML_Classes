<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Serviços.css">
    <title>Document</title>
</head>
<body>
    <div class='container'>
        <div class="title">Serviços</div>
        <form action="#">
            <div class="user-details">
                <div class="input-box">
                    <span class="details">Serviços Municipais</span>
                    <input type="text" name="Regiões" list='lista'>
                    <datalist id =lista>
                        <option value="São Paulo"></option>
                        <option value="Santos"></option>
                        <option value="Mauá"></option>
                        <option value="Guarujá"></option>
                        <option value="São Bernardo do Campo"></option>
                </div>
            </div>
           
            <div class="button">
                <input type="submit" value="Registo">
            </div>
        </form>
    </div>
</body>
</html>
