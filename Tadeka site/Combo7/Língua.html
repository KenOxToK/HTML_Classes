<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Língua.css">
    <title>Document</title>
</head>
<body>
    <div class='container'>
        <div class="title">Lingua idioma</div>
        <form action="#">
            <div class="user-details">
                <div class="input-box">
                    <span class="details">Lingua</span>
                    <input type="text" name="Lingua" list='lista'>
                    <datalist id =lista>
                        <option value="Inglês"></option>
                        <option value="Espanhol"></option>
                        <option value="Francês"></option>
                        <option value="Russo"></option>
                        <option value="Português-BR PT"></option>
                </div>
            </div>
           
            <div class="button">
                <input type="submit" value="Confirmo">
            </div>
        </form>
    </div>
</body>
</html>
